/* ═══════════════════════════ ONLINE APP ═══════════════════════════
   The app also lives on GitHub Pages (…github.io/recipe-viewer/app/). This carries a
   computer's settings over in one click: they ride in the link after # (never sent to
   any server) and are wiped from the address bar as soon as they're read. */
const Online = {
  url() {
    const v = PhoneLink.base();
    return v ? v.replace(/\/?$/, '/') + 'app/' : '';
  },
  isHosted: () => location.protocol === 'https:' || location.hostname === 'localhost',
  carry: ['gh', 'apiKey', 'model', 'workingModel', 'theme', 'background', 'kitchenName', 'viewerUrl', 'tagline'],
  move() {
    const s = Settings.get(), pack = Object.fromEntries(this.carry.filter(k => s[k]).map(k => [k, s[k]]));
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(pack)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    window.open(this.url() + '#setup=' + b64, '_blank');
  },
  // run once at start-up: pick up settings carried over from another copy
  receive() {
    const m = location.hash.match(/setup=([A-Za-z0-9_-]+)/); if (!m) return false;
    history.replaceState(null, '', location.pathname + location.search);   // take the key out of the address bar right away
    try {
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const pack = JSON.parse(decodeURIComponent(escape(atob(b64 + '==='.slice((b64.length + 3) % 4)))));
      Settings.save(Object.fromEntries(this.carry.filter(k => k in pack).map(k => [k, pack[k]])));
      return true;
    } catch { return false; }
  },
};

/* ═══════════════════════════ SHARE CARD ═══════════════════════════
   Draws a recipe as a tall, pretty picture (PNG) for texting or sharing. */
const ShareCard = {
  W: 1080, PAD: 64,

  canShareFiles() {
    try { return !!navigator.canShare?.({files: [new File(['x'], 'x.png', {type: 'image/png'})]}); } catch { return false; }
  },
  plain: s => String(s || '').replace(/\[\?\s*(.*?)\s*\?\]/g, '$1'),   // drop the "best guess" brackets

  loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  },
  wrap(ctx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const word of para.split(/\s+/)) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
      }
      out.push(line);
    }
    return out;
  },
  round(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); },

  async make(r) {
    await document.fonts?.ready;
    const t = CONFIG.themes[Settings.get().theme] || CONFIG.themes.Strawberry;
    const imgs = {icon: await this.loadImg(svgURL(appIconSVG(t)))};
    if (!r.icon && r.dishPhoto) imgs.photo = await this.loadImg(r.dishPhoto).catch(() => null);
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    c.width = this.W; c.height = 4000;
    const h = this.layout(ctx, r, t, imgs, false);       // measure first…
    c.height = Math.ceil(h);
    this.layout(ctx, r, t, imgs, true);                   // …then draw at the right height
    return new Promise(res => c.toBlob(res, 'image/png'));
  },

  // One layout routine: with draw=false it only measures, so the picture is exactly as tall as needed.
  layout(ctx, r, t, imgs, draw) {
    const {W, PAD} = this, inner = W - PAD * 2, cardX = PAD / 2, cardW = W - PAD;
    const head = t.style === 'rugged' ? '"Oswald", "Arial Narrow", sans-serif' : '"Fredoka", "Comic Sans MS", sans-serif', body = '"Nunito", sans-serif';
    let y = PAD / 2;

    if (draw) {
      const bg = ctx.createLinearGradient(0, 0, W, ctx.canvas.height);
      bg.addColorStop(0, t.bg1); bg.addColorStop(1, t.bg2);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, ctx.canvas.height);
      ctx.save(); ctx.shadowColor = 'rgba(150,50,110,.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
      ctx.fillStyle = t.surface || '#fff'; this.round(ctx, cardX, y, cardW, ctx.canvas.height - PAD, 44); ctx.fill(); ctx.restore();
    }

    // picture band: her icon, else her photo, else automatic icon
    const bandH = 380;
    if (draw) {
      ctx.save(); this.round(ctx, cardX, y, cardW, bandH, [44, 44, 0, 0]); ctx.clip();
      if (imgs.photo) {
        const p = imgs.photo, k = Math.max(cardW / p.width, bandH / p.height);
        ctx.drawImage(p, cardX + (cardW - p.width * k) / 2, y + (bandH - p.height * k) / 2, p.width * k, p.height * k);
      } else {
        const [a, b] = r.icon ? (CONFIG.cardColors[r.iconColor] || CONFIG.cardColors.Pink) : [t.soft, t.soft2];
        const g = ctx.createLinearGradient(cardX, y, cardX + cardW, y + bandH); g.addColorStop(0, a); g.addColorStop(1, b);
        ctx.fillStyle = g; ctx.fillRect(cardX, y, cardW, bandH);
        if (t.style === 'rugged') { ctx.fillStyle = 'rgba(20,18,17,.66)'; ctx.fillRect(cardX, y, cardW, bandH); }
        ctx.font = `200px ${body}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(r.icon || recipeEmoji(r), W / 2, y + bandH / 2 + 10);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
      ctx.restore();
    }
    y += bandH + 96;

    // title
    ctx.font = `600 64px ${head}`;
    for (const line of this.wrap(ctx, r.title || 'Recipe', inner)) {
      if (draw) { ctx.fillStyle = t.accent; ctx.fillText(line, PAD, y); }
      y += 76;
    }
    // little facts line
    const facts = [`${cuisineOf(r.cuisine).emoji} ${r.cuisine || 'Other'}`, r.time && `⏱ ${r.time}`, r.servings && `🍽 Serves ${r.servings}`]
      .filter(Boolean).join('   ·   ');
    ctx.font = `700 30px ${body}`;
    for (const line of this.wrap(ctx, facts, inner)) { if (draw) { ctx.fillStyle = t.muted || '#9a7f95'; ctx.fillText(line, PAD, y); } y += 42; }
    if (r.tags?.length) {
      ctx.font = `700 28px ${body}`;
      for (const line of this.wrap(ctx, r.tags.map(x => `${tagOf(x).emoji} ${x}`).join('   '), inner)) {
        if (draw) { ctx.fillStyle = t.accent2; ctx.fillText(line, PAD, y); } y += 40;
      }
    }
    y += 24;

    const section = (title) => {
      if (draw) {
        ctx.strokeStyle = t.line; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.moveTo(PAD, y - 6); ctx.lineTo(W - PAD, y - 6); ctx.stroke(); ctx.setLineDash([]);
      }
      y += 64; ctx.font = `600 44px ${head}`;
      if (draw) { ctx.fillStyle = t.ink || '#4b2e45'; ctx.fillText(title, PAD, y); }
      y += 28;
    };

    if (r.ingredients?.length) {
      section('🧂 Ingredients');
      ctx.font = `600 34px ${body}`;
      for (const item of r.ingredients) {
        y += 46;
        const lines = this.wrap(ctx, this.plain(item), inner - 50);
        if (draw) { ctx.fillStyle = t.accent; ctx.beginPath(); ctx.arc(PAD + 12, y - 11, 8, 0, 7); ctx.fill(); }
        lines.forEach((ln, i) => { if (draw) { ctx.fillStyle = t.ink || '#4b2e45'; ctx.fillText(ln, PAD + 44, y + i * 46); } });
        y += (lines.length - 1) * 46;
      }
      y += 40;
    }
    if (r.steps?.length) {
      section('👩‍🍳 Steps');
      r.steps.forEach((step, n) => {
        y += 54; ctx.font = `600 33px ${body}`;
        const lines = this.wrap(ctx, this.plain(step), inner - 76);
        if (draw) {
          const g = ctx.createLinearGradient(PAD, y - 40, PAD + 48, y + 8); g.addColorStop(0, t.accent); g.addColorStop(1, t.accent2);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(PAD + 24, y - 12, 24, 0, 7); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = `600 28px ${head}`; ctx.textAlign = 'center'; ctx.fillText(n + 1, PAD + 24, y - 2);
          ctx.textAlign = 'left'; ctx.font = `600 33px ${body}`; ctx.fillStyle = t.ink || '#4b2e45';
          lines.forEach((ln, i) => ctx.fillText(ln, PAD + 76, y + i * 46));
        }
        y += (lines.length - 1) * 46;
      });
      y += 40;
    }
    if (r.notes) {
      section('📝 Notes');
      ctx.font = `italic 600 31px ${body}`;
      for (const ln of this.wrap(ctx, this.plain(r.notes), inner)) { y += 44; if (draw) { ctx.fillStyle = t.muted || '#6d5468'; ctx.fillText(ln, PAD, y); } }
      y += 40;
    }

    // signature
    y += 80;
    const name = Settings.get().kitchenName || CONFIG.appName;
    if (draw) {
      ctx.drawImage(imgs.icon, PAD, y - 54, 72, 72);
      ctx.font = t.style === 'rugged' ? `52px "Bebas Neue", "Oswald", sans-serif` : `44px "Pacifico", cursive`;
      ctx.fillStyle = t.accent; ctx.fillText(t.style === 'rugged' ? `from ${name} 🔥` : `from ${name} 💕`, PAD + 92, y);
    }
    return y + 70;
  },

  asText(r) {
    const p = this.plain;
    return [`💕 ${p(r.title)}`,
      [r.cuisine, r.time && `⏱ ${r.time}`, r.servings && `Serves ${r.servings}`].filter(Boolean).join(' · '), '',
      r.ingredients?.length ? 'INGREDIENTS\n' + r.ingredients.map(x => '• ' + p(x)).join('\n') : '', '',
      r.steps?.length ? 'STEPS\n' + r.steps.map((x, i) => `${i + 1}. ${p(x)}`).join('\n') : '',
      r.notes ? `\nNotes: ${p(r.notes)}` : '', r.link ? `\n▶️ ${r.link}` : '',
      `\n— from ${Settings.get().kitchenName || CONFIG.appName}`].filter(x => x !== undefined).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  },
  fileName: r => (r.title || 'recipe').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, ' ') + '.png',
};

/* ═══════════════════════════ VIEWS (one per tab) ═══════════════════════════ */
const VIEWS = {
  recipes: { title: 'Recipes', icon: '📖', render: renderRecipes },
  supper:  { title: "What's to Eat?", icon: '🍽️', render: renderSupper },
  tryList: { title: 'To Try', icon: '📌', render: renderTryList, badge: () => State.tryList.length },
  shopping:{ title: 'List', icon: '🛒', render: renderShopping, badge: () => State.shopping.filter(x => !x.done).length },
  pantry:  { title: 'Pantry', icon: '🧺', render: renderPantry },
};

function render() {
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v]) =>
    `<button class="${State.view === k ? 'on' : ''}" data-action="go" data-view="${k}">${v.icon} ${v.title}${v.badge?.() ? ` <span class="nav-badge">${v.badge()}</span>` : ''}</button>`).join('');
  $('#main').innerHTML = VIEWS[State.view].render();
}

/* ── Recipes tab ── */
function filteredRecipes() {
  const q = State.search.trim().toLowerCase(), f = State.filter;
  return State.recipes
    .filter(r => f === 'all' || (f === 'fav' && r.favorite) ||
      (f.startsWith('cuisine:') && r.cuisine === f.slice(8)) ||
      (f.startsWith('tag:') && (r.tags||[]).includes(f.slice(4))) ||
      (f === 'diet' && Diet.fits(r)))
    .filter(r => !q || [r.title, r.cuisine, r.category, r.source, ...(r.tags||[]), ...(r.ingredients||[])]
      .join(' ').toLowerCase().includes(q))
    .sort((a, b) => (b.favorite - a.favorite) || a.title.localeCompare(b.title));
}

// The picture at the top of a card: her chosen icon, else her photo, else an automatic icon
function cardPic(r, cls = 'pic') {
  if (r.icon) {
    const [a, b] = CONFIG.cardColors[r.iconColor] || CONFIG.cardColors.Pink;
    const dim = UI.theme().style === 'rugged' ? 'linear-gradient(rgba(20,18,17,.72),rgba(20,18,17,.6)),' : '';   // deeper tones on dark themes
    return `<div class="${cls}" style="background:${dim}linear-gradient(135deg,${a},${b})"><span class="card-icon">${r.icon}</span></div>`;
  }
  if (r.dishPhoto) return `<div class="${cls}" style="background-image:url('${r.dishPhoto}');background-size:cover;background-position:center"></div>`;
  return `<div class="${cls}" style="background:linear-gradient(135deg,var(--soft),var(--soft-2))"><span class="card-icon">${recipeEmoji(r)}</span></div>`;
}

function recipeCard(r) {
  const pic = cardPic(r);
  const tags = (r.tags||[]).slice(0, 3).map(t => `<span class="tag alt">${tagOf(t).emoji} ${esc(t)}</span>`).join('');
  return `<div class="card" data-action="openRecipe" data-id="${r.id}">
    ${pic}
    <button class="heart ${r.favorite ? 'on' : ''}" data-action="toggleFav" data-id="${r.id}" title="Favorite">${r.favorite ? '💖' : '🤍'}</button>
    <div class="body">
      <h3>${esc(r.title) || 'Untitled recipe'}</h3>
      <div class="meta"><span class="tag">${cuisineOf(r.cuisine).emoji} ${esc(r.cuisine || 'Other')}</span>${tags}
      ${r.time ? `<span class="tag green">⏱ ${esc(r.time)}</span>` : ''}${Diet.active() && Diet.fits(r) ? '<span class="tag green" title="Fits our diet">🥗</span>' : ''}</div>
    </div></div>`;
}

function renderRecipes() {
  const list = filteredRecipes();
  const usedCuisines = [...new Set(State.recipes.map(r => r.cuisine).filter(Boolean))];
  const usedTags = [...new Set(State.recipes.flatMap(r => r.tags || []))];
  const favCount = State.recipes.filter(r => r.favorite).length;
  const chip = (val, label) => `<button class="chip ${State.filter === val ? 'on' : ''}" data-action="setFilter" data-val="${esc(val)}">${label}</button>`;

  const filters = State.recipes.length ? `<div class="filters">
      <div class="chips">${chip('all', `📚 All (${State.recipes.length})`)}${chip('fav', `💖 Favorites (${favCount})`)}
        ${Diet.active() && State.recipes.some(Diet.checked) ? chip('diet', `🥗 Fits our diet (${State.recipes.filter(Diet.fits).length})`) : ''}
        ${usedCuisines.map(c => chip('cuisine:' + c, `${cuisineOf(c).emoji} ${esc(c)}`)).join('')}</div>
      ${usedTags.length ? `<div class="chips">${usedTags.map(t => chip('tag:' + t, `${tagOf(t).emoji} ${esc(t)}`)).join('')}</div>` : ''}
    </div>` : '';

  const body = !State.recipes.length
    ? `<div class="panel empty"><div class="big">📸</div><h2>Your recipe box is empty!</h2>
        <p class="muted">Snap a picture of a recipe from a cookbook, magazine or an old card<br>and it'll be typed out for you like magic.</p>
        <button class="btn primary big" data-action="addRecipe">＋ Add my first recipe</button></div>`
    : list.length ? `<div class="grid">${list.map(recipeCard).join('')}</div>`
    : `<div class="panel empty"><div class="big">🔍</div><h2>Nothing matches</h2><p class="muted">Try a different word or filter.</p></div>`;

  return `<div class="toolbar">
      <div class="search"><span>🔎</span><input class="field" id="search" placeholder="Search recipes, ingredients, tags…" value="${esc(State.search)}"></div>
      <button class="btn primary big" data-action="addRecipe">📸 Add Recipe</button>
    </div>${filters}${body}`;
}

/* ── Supper tab ── */
function renderSupper() {
  const s = State.supper;
  s.meal ||= mealNow();
  const meal = mealOf(s.meal);
  const mChips = CONFIG.meals.map(m =>
    `<button class="meal-pick ${s.meal === m.name ? 'on' : ''}" data-action="setMeal" data-val="${m.name}"><span>${m.emoji}</span>${m.name}</button>`).join('');
  const recent = State.recentIdeas.filter(x => !(s.ideas || []).some(i => i.id === x.id));
  const recentHTML = recent.length ? `<details class="recent"><summary>🕘 Recent ideas <span class="muted">(${recent.length})</span></summary>
      <div class="recent-list">${recent.map(x => `
        <div class="recent-row">
          <span class="emo">${ideaEmoji(x)}</span>
          <button class="link-btn" data-action="openIdea" data-id="${x.id}">${esc(x.name)}</button>
          <span class="muted">${mealOf(x.meal).emoji} ${esc(x.meal || '')} · ${new Date(x.date).toLocaleDateString()}</span>
          ${onTryList(x.id) ? '<span class="tag peach">📌</span>' : `<button class="btn ghost small" data-action="pinIdea" data-id="${x.id}">📌 Want to try</button>`}
        </div>`).join('')}</div></details>` : '';
  const pChips = CONFIG.proteins.map(p =>
    `<button class="chip ${s.protein === p.name ? 'on' : ''}" data-action="setProtein" data-val="${p.name}">${p.emoji} ${p.name}</button>`).join('');
  const cChips = [{name:'Surprise', emoji:'🎲'}, ...CONFIG.cuisines.filter(c => c.name !== 'Other')].map(c =>
    `<button class="chip ${s.cuisine === c.name ? 'on' : ''}" data-action="setCuisine" data-val="${c.name}">${c.emoji} ${c.name === 'Surprise' ? 'Surprise me!' : c.name}</button>`).join('');

  let results = '';
  if (s.loading) results = `<div class="loading"><div class="whisk">🥄</div><h3 class="dots">Stirring up some ideas</h3><p class="muted" id="aiStatus"></p></div>`;
  else if (s.ideas) results = `<div class="ideas">${s.ideas.map(ideaCard).join('')}</div>`;

  return `<div class="supper-head"><h2>What's for ${meal.name === 'Supper' ? 'supper tonight' : meal.name.toLowerCase()}?</h2><p class="muted">${UI.look().mealLine}</p></div>
    <div class="meal-row">${mChips}</div>
    <div class="panel"><div class="pick-grid">
      <div><h3>🥩 Protein</h3><div class="chips">${pChips}</div></div>
      <div><h3>🌎 Feeling like…</h3><div class="chips">${cChips}</div></div>
    </div>
    <div class="go-row">
      <label class="switch"><input type="checkbox" id="usePantry" ${s.usePantry ? 'checked' : ''}><i></i>
        Use what's in my pantry <span class="muted">(${State.pantry.length} items)</span></label>
      ${Diet.active() ? `<label class="switch"><input type="checkbox" id="followDiet" ${s.followDiet !== false ? 'checked' : ''}><i></i>
        🥗 Follow our diet <span class="muted">(${esc(Diet.text())})</span></label>` : ''}
    </div>
    <div class="go-row">
      <button class="btn primary big" data-action="getIdeas" ${s.loading ? 'disabled' : ''}>✨ Give me ideas!</button>
      <button class="btn soft big" data-action="spinBox" ${!State.recipes.length ? 'disabled title="Add some recipes first"' : ''}>🎰 Spin my recipe box</button>
    </div></div>
    ${!AI.hasKey() && !s.ideas ? UI.noKeyMessage() : ''}${results}${recentHTML}`;
}

function ideaCard(idea, i) {
  const saved = idea.savedId && State.recipes.find(r => r.id === idea.savedId);
  const chips = (arr, cls) => (arr||[]).filter(Boolean).map(x => `<span class="tag ${cls}">${esc(x)}</span>`).join('');
  const how = !saved && idea.steps?.length
    ? `<button class="btn ghost" style="padding:4px 0;align-self:flex-start" data-action="openIdea" data-id="${idea.id}">👩‍🍳 See the whole recipe</button>` : '';
  return `<div class="idea" style="animation-delay:${i * 80}ms">
    <div class="top"><div class="emo">${saved ? (saved.icon || recipeEmoji(saved)) : ideaEmoji(idea)}</div><div style="flex:1">
      <h3>${esc(saved ? saved.title : idea.name)}</h3>
      <div class="row" style="margin-top:6px">${saved ? '<span class="tag from-box">💖 From your recipe box</span>' : ''}
        <span class="tag">${esc(idea.cuisine || '')}</span>${idea.time ? `<span class="tag green">⏱ ${esc(idea.time)}</span>` : ''}</div>
    </div></div>
    ${idea.why ? `<p>${esc(idea.why)}</p>` : ''}
    ${idea.dietNote ? `<p class="diet-note">🥗 ${esc(idea.dietNote)}</p>` : ''}
    ${idea.uses?.length ? `<div class="row"><b>You have</b>${chips(idea.uses, 'green')}</div>` : ''}
    ${idea.needToBuy?.length ? `<div class="row"><b>Grab</b>${chips(idea.needToBuy, 'peach')}</div>` : ''}
    ${how}
    <div class="acts">${saved
      ? `<button class="btn primary" data-action="openRecipe" data-id="${saved.id}">📖 Open recipe</button>`
      : idea.steps?.length ? `
        ${onTryList(idea.id) ? '<span class="tag peach" style="align-self:center">📌 On your To Try list</span>'
          : `<button class="btn primary" data-action="pinIdea" data-id="${idea.id}">📌 Want to try</button>`}
        <button class="btn soft" data-action="saveIdea" data-id="${idea.id}">💾 Save to box</button>` : ''}</div>
  </div>`;
}

/* ── Diet helpers ──
   State.diet = {list:[names], other:'free text'}; shared by all computers through GitHub.
   A recipe's check is kept with the diet it was checked against (dietKey), so changing
   the diet shows recipes as "not checked yet" instead of giving stale answers. */
const Diet = {
  text: () => [...State.diet.list, (State.diet.other || '').trim()].filter(Boolean).join(', '),
  active: () => !!Diet.text(),
  key: () => Diet.text().toLowerCase(),
  checked: r => !!r.dietKey && r.dietKey === Diet.key(),
  fits: r => Diet.checked(r) && !(r.dietWarn || []).length,
  save: () => Store.set('diet', State.diet),
  emoji: name => CONFIG.diets.find(d => d.name === name)?.emoji || '🥗',
  apply(r, res) { r.dietFits = res.fits || []; r.dietWarn = (res.warnings || []).filter(Boolean); r.dietKey = Diet.key(); },
};

/* ── Meal + idea helpers ── */
const ideaEmoji = x => x.emoji || cuisineOf(x.cuisine).emoji;
function mealOf(name) { return CONFIG.meals.find(m => m.name === name) || CONFIG.meals.at(-1); }
function mealNow() { const h = new Date().getHours() + new Date().getMinutes() / 60; return CONFIG.meals.find(m => h < m.until).name; }
function findIdea(id) {
  return [...(State.supper.ideas || []), ...State.tryList, ...State.recentIdeas].find(x => x.id === id);
}
const onTryList = id => State.tryList.some(x => x.id === id);
function saveIdeaLists() { Store.set('tryList', State.tryList); Store.set('recentIdeas', State.recentIdeas); }
function ideaToRecipe(idea, extra = {}) {
  return {id:uid(), title:idea.name, cuisine:idea.cuisine || 'Other', category:mealOf(idea.meal).category, time:idea.time || '',
    ingredients:idea.ingredients || [], steps:idea.steps || [], notes:[idea.why, idea.dietNote && '🥗 ' + idea.dietNote].filter(Boolean).join('\n'), source:`${idea.meal || 'Supper'} idea ✨`,
    tags:[], favorite:false, created:Date.now(), updated:Date.now(),
    ...(idea.emoji ? {icon: idea.emoji, iconColor: pick(Object.keys(CONFIG.cardColors))} : {}), ...extra};
}

/* ── To Try tab: ideas waiting to be tried, before they earn a spot in the box ── */
function renderTryList() {
  const list = [...State.tryList].sort((a, b) => b.pinned - a.pinned);
  const body = list.length ? `<div class="ideas">${list.map((x, i) => `
      <div class="idea" style="animation-delay:${i * 60}ms">
        <div class="top"><div class="emo">${ideaEmoji(x)}</div><div style="flex:1">

/* ── Shopping list ──
   Items are grouped by store aisle, using the pantry shelves (CONFIG.pantryGroups) to guess the aisle. */
const Shop = {
  OTHER: '🛒 Everything else',
  // words that tell an aisle on their own (checked before the shelf lists)
  hints: [['❄️ Freezer', /\bfrozen\b|ice cream|cool whip|tater tots/i],
          ['🥩 Meat & Fish', /\b(chicken|beef|pork|steak|bacon|ham|sausage|turkey|shrimp|salmon|fish|tilapia|catfish|brisket|roast|chops?|meatballs?)\b/i],
          ['🧀 Dairy & Eggs', /\b(milk|butter|cheese|cream|yogurt|eggs?|buttermilk)\b/i],
          ['🧂 Spices', /\b(seasoning|powder|paprika|cumin|oregano|cinnamon|nutmeg|thyme|rosemary|basil|pepper flakes|bay lea)/i]],
  aisleOf(name) {
    const n = name.toLowerCase();
    for (const [aisle, rx] of this.hints) if (rx.test(n)) return aisle;
    let best = null, len = 0;
    for (const [aisle, items] of Object.entries(CONFIG.pantryGroups))
      for (const it of items) { const w = this.stem(it); if (n.includes(w) && w.length > len) { best = aisle; len = w.length; } }
    return best || this.OTHER;
  },
  // "1 1/2 cups shredded cheddar cheese" → "shredded cheddar cheese" (for the pantry)
  bare: name => name.replace(/^[\d\s\/½¼¾⅓⅔.,-]+/, '').replace(/^(cups?|c\.|tbsp|tablespoons?|tsp|teaspoons?|oz|ounces?|lbs?|pounds?|g|kg|cans?|packages?|pkg|packets?|jars?|bags?|boxes?|sticks?|cloves?|pinch|dash|large|medium|small|whole)\b\.?\s*(of\s+)?/i, '').replace(/^(cups?|cans?|lbs?|oz)\b\s*/i, '').trim() || name,
  // already in the pantry? (a pantry word like "rice" found in "2 cups rice")
  stem: w => w.toLowerCase().trim().replace(/(oes|ies)$/, m => m === 'ies' ? 'y' : 'o').replace(/(ches|shes|sses)$/, m => m.slice(0, -2)).replace(/s$/, ''),
  inPantry: name => State.pantry.some(p => p.length > 2 && name.toLowerCase().includes(Shop.stem(p))),
  staple: name => /\b(water|ice)\b/i.test(name) && name.length < 30,
  has: name => State.shopping.some(x => !x.done && x.name.toLowerCase() === name.toLowerCase()),
  add(names, from = '') {
    let n = 0;
    for (const raw of names) {
      const name = String(raw).trim(); if (!name || this.has(name)) continue;
      State.shopping.push({id: uid(), name, aisle: this.aisleOf(name), done: false, from, added: Date.now()}); n++;
    }
    this.save(); return n;
  },
  save() { Store.set('shopping', State.shopping); },
  grouped(list = State.shopping) {
    const order = [...Object.keys(CONFIG.pantryGroups), this.OTHER];
    const g = {};
    for (const x of list) (g[x.aisle] ||= []).push(x);
    return order.filter(a => g[a]).map(a => [a, g[a]]);
  },
};

// Diet status on a recipe page
function dietBox(r) {
  if (!Diet.active()) return '';
  if (!Diet.checked(r)) return `<div class="diet-box"><span>🥗 Not checked against our diet yet</span>
    <button class="btn soft small" data-action="checkDiet" data-id="${r.id}">🔍 Check it</button></div>`;
  const fits = (r.dietFits || []).map(d => `<span class="tag green">${Diet.emoji(d)} ${esc(d)}</span>`).join('');
  return `<div class="diet-box ${r.dietWarn?.length ? 'warn' : 'ok'}">
    ${fits ? `<div class="chips" style="gap:6px">${fits}</div>` : ''}
    ${r.dietWarn?.length ? `<ul>${r.dietWarn.map(w => `<li>⚠️ ${esc(w)}</li>`).join('')}</ul>
      <button class="btn primary small" data-action="makeFit" data-id="${r.id}">✨ Make it fit</button>`

}

// Turn the chat's labelled answer into a recipe. Forgiving about bold text, bullets and numbering.
function parseChatRecipe(text) {
  const r = {title:'', cuisine:'', category:'', servings:'', time:'', tags:[], source:'', ingredients:[], steps:[], notes:''};
  const field = {title:'title', cuisine:'cuisine', type:'category', category:'category', serves:'servings', servings:'servings',
    yield:'servings', time:'time', tags:'tags', source:'source', from:'source', ingredients:'ingredients',
    steps:'steps', directions:'steps', instructions:'steps', method:'steps', notes:'notes'};
  let section = null;
  for (let raw of String(text).split('\n')) {
    const line = raw.replace(/\*\*|__|^#+\s*/g, '').trim();
    if (!line) continue;
    const m = line.match(/^([A-Za-z]+)\s*:\s*(.*)$/);
    const key = m && field[m[1].toLowerCase()];
    if (key) {
      section = key; const val = m[2].replace(/^\(.*\)$/, '').trim();
      if (key === 'tags') r.tags = val.split(',').map(t => t.trim()).filter(Boolean);
      else if (key === 'ingredients' || key === 'steps') { if (val) r[key].push(val); }
      else if (key === 'notes') r.notes = val;
      else r[key] = val;
      continue;
    }
    const item = line.replace(/^([-*•▪◦]|\d+[.)])\s*/, '').trim();
    if (section === 'ingredients' || section === 'steps') r[section].push(item);
    else if (section === 'notes') r.notes += (r.notes ? '\n' : '') + line;
    else if (!r.title) r.title = line;
  }
  return r;
}

/* ═══════════════════════════ ACTIONS ═══════════════════════════
   Every clickable thing has data-action="name"; the handler lives here. */
const ACTIONS = {
  go: el => { State.view = el.dataset.view; render(); window.scrollTo({top:0, behavior:'smooth'}); },
  setFilter: el => { State.filter = el.dataset.val; render(); },

  closeModal: () => UI.closeModal(),
  scrimClose: (el, ev) => { if (ev.target === el && !State.draft) UI.closeModal(); },

  openRecipe: el => showRecipe(el.dataset.id),
  tick: el => el.classList.toggle('done'),
  pickPhoto: el => {
    $('#photoMain').style.backgroundImage = `url('${el.src}')`;
    $$('.thumbs img').forEach(i => i.classList.toggle('on', i === el));
  },
  zoom: el => {
    const url = el.style.backgroundImage.slice(5, -2);
    const v = document.createElement('div'); v.className = 'viewer'; v.innerHTML = `<img src="${url}">`;
    v.onclick = () => v.remove(); document.body.appendChild(v);
  },

  async toggleFav(el, ev) {
    const r = State.recipes.find(x => x.id === el.dataset.id); if (!r) return;
    r.favorite = !r.favorite; await Store.put(r);
    if (r.favorite) UI.hearts(ev.clientX, ev.clientY);
    const inModal = el.closest('.modal');
    render(); if (inModal) showRecipe(r.id);
  },

  addRecipe: () => { State.draft = {id:null, photos:[]}; showAddPhotos(); },
  pickFiles: () => $('#filePick').click(),
  removeShot: el => {
    State.draft.photos.splice(+el.dataset.i, 1);
    if (el.dataset.back === 'form') { readForm(); showEditForm(); } else showAddPhotos();
  },
  typeItMyself: () => { State.draft = {...State.draft, tags:[]}; showEditForm(); },

  async readPhotos() {
    const body = $('.modal-body'), foot = $('.modal-foot');
    body.innerHTML = `<div class="loading"><div class="whisk">🥄</div><h3 class="dots">Reading your recipe</h3>
      <p class="muted" id="aiStatus">${State.draft.video ? 'Watching the video — this can take a minute' : 'Handwritten cards can take a little longer'}</p></div>`;
    foot.style.display = 'none';
    AI.status = msg => { if (msg && $('#aiStatus')) $('#aiStatus').textContent = msg + '…'; };
    try {
      const d = State.draft, link = (d.link || '').trim();
      let text = d.pastedText || '', openLink = false;
      if (isLink(link) && !text && !d.video && !d.photos.length) {
        if (isTikTok(link)) {
          AI.status('Looking up the TikTok');
          const tt = await AI.tiktokInfo(link);
          if (tt.caption) text = tt.caption + (tt.author ? `\n(Video by @${tt.author})` : '');
        }
        if (!text) openLink = true;                               // let Gemini open the page itself
        AI.status('Reading the recipe');
      }
      const r = await AI.readRecipe(openLink ? [] : d.photos, text, link, d.video || null, openLink);
      if (!(r.ingredients || []).length) throw Object.assign(new Error('NO_RECIPE'), {noRecipe: true});
      fillDraft(r);
      showEditForm(); UI.toast('✨ All done! Look it over and save.');
    } catch (e) {
      if (e.noRecipe) {
        State.moreWays = true; showAddPhotos();
        UI.toast(isTikTok(State.draft.link)
          ? "🤔 That TikTok's description doesn't have the recipe — it's probably only said in the video. Try 🎬 Add a saved video below."
          : "🤔 Couldn't find a recipe there. Try a picture or paste the recipe text.", 7000);
        return;
      }
      showAddPhotos(); UI.toast(e.message === 'NO_KEY' ? 'Add a Gemini key in Settings first' : '😕 ' + e.message);
    }
  },
  async pasteLink() {
    try {
      const t = (await navigator.clipboard.readText()).trim();
      if (!t) return UI.toast('Nothing copied yet — in TikTok tap Share → Copy link');
      State.draft.link = t; $('#v_link').value = t; $('#readBtn').disabled = !canRead();
    } catch { $('#v_link').focus(); UI.toast('Press Ctrl + V to paste the link'); }
  },
  pasteChat: () => showPasteChat(),
  backToPhotos: () => showAddPhotos(),
  async copyChatPrompt(el) {
    try { await navigator.clipboard.writeText(CHAT_PROMPT); }
    catch {                                   // older fallback
      const t = document.createElement('textarea'); t.value = CHAT_PROMPT; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); t.remove();
    }
    el.textContent = '✅ Copied!'; setTimeout(() => el.textContent = '📋 Copy helper message', 2000);
  },
  fillFromChat: () => {
    const text = $('#chatPaste').value.trim();
    if (!text) return UI.toast('Paste the answer from the chat first 💕');
    const r = parseChatRecipe(text);
    if (!r.ingredients.length && !r.steps.length) return UI.toast("😕 Couldn't find the ingredients — did the whole answer get copied?");
    fillDraft(r); showEditForm(); UI.toast('✨ Filled in! Look it over and save.');
  },

  editRecipe: el => {
    const r = State.recipes.find(x => x.id === el.dataset.id);
    State.draft = structuredClone(r); showEditForm();
  },
  toggleTag: el => {
    readForm(); const t = el.dataset.val, tags = State.draft.tags ||= [];
    tags.includes(t) ? tags.splice(tags.indexOf(t), 1) : tags.push(t);
    el.classList.toggle('on');
  },
  newTag: el => {
    readForm();
    const name = (prompt('New tag name (like "Church Supper" or "Summer"):') || '').trim();
    if (!name) return;
    (State.draft.tags ||= []).includes(name) || State.draft.tags.push(name);
    showEditForm();
  },
  async saveRecipe() {
    readForm(); const d = State.draft;
    if (!d.title) { UI.toast('Give it a name first 💕'); $('#f_title').focus(); return; }
    const {pastedText, video, photos, ...clean} = d;          // scanned photos are left behind
    const r = {favorite:false, tags:[], ...clean, id: d.id || uid(), updated: Date.now()};
    const before = State.recipes.find(x => x.id === r.id);
    if (before && JSON.stringify(before.ingredients) !== JSON.stringify(r.ingredients)) { delete r.dietKey; delete r.dietFits; delete r.dietWarn; }
    r.created ||= Date.now();
    await Store.put(r);
    State.recipes = State.recipes.filter(x => x.id !== r.id).concat(r);
    UI.closeModal(); render(); showRecipe(r.id); UI.toast('💾 Saved to your recipe box!');

  async deleteRecipe(el) {

    if (!AI.hasKey()) { UI.toast('Add a Gemini key in Settings first 🔑'); return showSettings(); }
    const s = State.supper; s.loading = true; s.ideas = null; render();
    AI.status = msg => { if (msg && $('#aiStatus')) $('#aiStatus').textContent = msg + '…'; };
    try {
      const out = await AI.suggestSupper({meal:s.meal, protein:s.protein, cuisine:s.cuisine,

        diet: Diet.active() && s.followDiet !== false ? Diet.text() : ''});
      const now = Date.now();
      s.ideas = (out.ideas || []).slice(0, 6).map(x => ({...x, id: uid(), meal: s.meal, date: now,
        savedId: State.recipes.some(r => r.id === x.savedId) ? x.savedId : null}));

    if (p?.words.length) pool = pool.filter(r => p.words.some(w => (r.title + ' ' + (r.ingredients||[]).join(' ')).toLowerCase().includes(w)));
    if (Diet.active() && s.followDiet !== false && pool.some(Diet.fits)) pool = pool.filter(Diet.fits);

/* ═══════════════════════════ WIRING ═══════════════════════════ */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.dataset.action !== 'scrimClose') ev.stopPropagation();
  // a click inside a card's heart shouldn't also open the card
  fn(el, ev);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'v_link' || ev.target.id === 'v_text') {
    State.draft[ev.target.id === 'v_link' ? 'link' : 'pastedText'] = ev.target.value;
    $('#readBtn').disabled = !canRead();
  }
  if (ev.target.id === 'search') {
    State.search = ev.target.value;
    const pos = ev.target.selectionStart; render();
    const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'usePantry') State.supper.usePantry = ev.target.checked;
  if (ev.target.id === 'followDiet') State.supper.followDiet = ev.target.checked;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'pantryInput') ACTIONS.addPantry();
  if (ev.key === 'Enter' && ev.target.id === 'shopInput') ACTIONS.addShop();
  if (ev.key === 'Enter' && ev.target.id === 'wishInput') ACTIONS.addWish();
  if (ev.key === 'Escape') { if ($('.viewer')) $('.viewer').remove(); else if ($('#layer').innerHTML && !State.draft) UI.closeModal(); }
});
$('#filePick').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('#dishPick').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  const r = State.recipes.find(x => x.id === State.dishFor); if (!f || !r) return;
  try {
    r.dishPhoto = await shrinkImage(f, 1200, 0.82);
    if (r.dishPhotoFile) Sync.queueDelete(r.dishPhotoFile);
    r.dishPhotoFile = Sync.photoPath(r.id); Sync.queuePhoto(r.id);
    r.icon = null;                                        // show the new photo on the card
    await Store.put(r); render(); showRecipe(r.id); UI.toast('📷 Looks delicious!');
  } catch (err) { UI.toast('😕 ' + err.message); }
});
$('#videoPick').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !State.draft) return;
  if (f.size > CONFIG.ai.maxVideoMB * 1e6) return UI.toast(`😕 That video is too big (over ${CONFIG.ai.maxVideoMB} MB)`);
  State.draft.video = f; showAddPhotos();
});
$('#bgPick').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = await shrinkImage(f, 1600, 0.78);
    Store.set('bgPhoto', data);
    if (Store.get('bgPhoto', null) !== data) throw new Error('too big');
    Settings.save({background: 'My Photo'}); UI.applyBackground();
    if ($('#bgTiles')) $('#bgTiles').innerHTML = bgTilesHTML();
    UI.toast('🖼️ New background!');
  } catch { UI.toast('😕 Could not use that picture — try a smaller one'); }
});
$('#backupPick').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.recipes)) throw new Error();
    if (!confirm(`Restore ${data.recipes.length} recipes? Recipes with the same name/id will be replaced.`)) return;
    await dropScans(data.recipes);
    for (const r of data.recipes) {
      if (r.dishPhoto && !r.dishPhotoFile) { r.dishPhotoFile = Sync.photoPath(r.id); Sync.queuePhoto(r.id); }
      await Store.put(r, {touch: false});
    }
    State.recipes = await Store.all();
    if (Array.isArray(data.pantry)) { State.pantry = data.pantry; Store.set('pantry', State.pantry); }
    if (Array.isArray(data.tryList)) {
      const have = new Set(State.tryList.map(x => x.id));
      State.tryList.push(...data.tryList.filter(x => !have.has(x.id))); saveIdeaLists();
    }
    UI.closeModal(); render(); UI.toast(`💾 Restored ${data.recipes.length} recipes`);
  } catch { UI.toast("😕 That doesn't look like a recipe box backup"); }
});

// Older versions saved the scanned recipe photos; they aren't needed once the recipe is typed out.
async function dropScans(list) {
  for (const r of list) if ('photos' in r) { delete r.photos; await Store.put(r, {touch: false, sync: false}); }
}

(async function start() {
  const arrived = Online.receive();
  UI.applyTheme();
  if (Online.isHosted() && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { await Store.open(); State.recipes = await Store.all(); await dropScans(State.recipes); }
  catch { UI.toast('😕 Could not open the recipe storage'); }
  State.pantry = Store.get('pantry', []);
  State.tryList = Store.get('tryList', []);
  State.recentIdeas = Store.get('recentIdeas', []);
  State.shopping = Store.get('shopping', []);
  State.diet = Store.get('diet', {list: [], other: ''});
  State.wishes = Store.get('wishes', []);
  navigator.storage?.persist?.();      // ask Chrome not to clear our data
  render();
  if (arrived) UI.toast('🚀 Welcome to the online app! Bringing in your recipes…', 4000);
  if (Sync.enabled()) Sync.run();     // pull anything new from GitHub
  // sync again when coming back to the app or getting back online
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Sync.enabled() && Date.now() - Sync.lastOk > 60000) Sync.run(); });
  window.addEventListener('online', () => Sync.enabled() && Sync.run());
})();
</script>
</body>
</html>
